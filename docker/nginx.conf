# ============================================================
#  导航站 v2 — nginx 站点配置（Docker 部署用）
#
#  设计原则：后端只暴露一个入口 /api/index.php。
#  api/ 与 config/ 下的其它文件虽然自带 NAV_ENTRY 守卫
#  （直接访问返回 403），这里再拦一层，做到「就算守卫失效也拿不到」。
# ============================================================

server {
    listen       80;
    server_name  _;

    root  /var/www/html;
    index index.html;

    charset                utf-8;
    server_tokens          off;
    client_max_body_size   5m;

    # 静态 404 页（只在显式 return 404 / =404 时触发，不影响 SPA 路由）
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---------------- 静态资源 ----------------
    # 带内容哈希，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 用户上传的图标（与 app 容器共享的数据卷）
    location /uploads/ {
        expires 7d;
        try_files $uri =404;
    }

    # ---------------- 敏感文件一律 404 ----------------
    # 数据库实际放在 /data（站点根之外），这里只是万一的兜底
    location ~* \.(db|db-wal|db-shm|sqlite|sqlite3|rar|zip|7z|bak|log|ini|json)$ {
        return 404;
    }

    # v1 遗留文件，即使误传到站点根也不给下载
    location ~* ^/(data\.(db|json)|api\.php|admin\.html|login\.html)$ {
        return 404;
    }

    # ---------------- 后端唯一入口 ----------------
    # 精确匹配优先级最高，会先于下面的正则命中
    location = /api/index.php {
        fastcgi_pass          app:9000;
        fastcgi_index         index.php;
        include               fastcgi_params;

        fastcgi_param  SCRIPT_FILENAME  /var/www/html/api/index.php;
        fastcgi_param  SCRIPT_NAME      /api/index.php;

        fastcgi_read_timeout  60s;
        fastcgi_buffers       16 16k;
        fastcgi_buffer_size   32k;
    }

    # 其它任何 .php 都不允许直接访问
    location ~ \.php$ {
        return 404;
    }

    # 隐藏文件（.user.ini / .git 等）
    location ~ /\. {
        deny all;
        return 404;
    }

    # ---------------- SPA ----------------
    # 前端用的是 Hash 路由，其实不需要 rewrite 兜底；留着是为了以后换 History 路由不炸
    location / {
        try_files $uri $uri/ /index.html;
    }
}
