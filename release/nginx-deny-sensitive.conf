# ===== 导航站 v2 兜底规则 =====
# 粘到宝塔：「网站 → nav → 配置文件」的 server { } 里，
# 必须放在 location ~ \.php 那一段的「前面」。
#
# 作用（两层保险）：
#  1. 万一 open_basedir 被宝塔重置、数据库退回站点根下的 storage/，
#     这条规则仍然挡住 HTTP 直连下载。
#  2. 挡住升级前的 v1 遗留文件（data.db / data.json），
#     就算漏删了，外部也拿不到。
#
# 主防线是 .user.ini 里的 open_basedir（把库放在站点根之外），
# 这份规则是「万一」用的，建议一并加上。

location ^~ /storage/ {
    deny all;
    return 404;
}

location ~* \.(db|db-wal|db-shm|sqlite|sqlite3|json)$ {
    deny all;
    return 404;
}
